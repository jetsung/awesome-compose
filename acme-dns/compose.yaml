---
# https://hub.docker.com/r/joohoi/acme-dns
services:
  acme-dns:
    container_name: acme-dns
    env_file:
      - path: ./.env
        required: false
    image: joohoi/acme-dns:latest
#     ports:
#       - 53:53
#       - 53:53/udp
#       - ${SERV_PORT:-80}:80
    restart: unless-stopped
    volumes:
#       - ./config:/etc/acme-dns:ro
      - ./data:/var/lib/acme-dns
