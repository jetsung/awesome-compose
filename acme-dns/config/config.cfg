[general]
# DNS 监听地址
# 注意：systemd-resolved 可能占用 127.0.0.53 的 53 端口，导致 acme-dns 启动报错，
# 此时需显式指定监听地址，例如: listen = "127.0.0.1:53"
listen = "0.0.0.0:53"
# DNS 协议: "both", "both4", "both6", "udp", "udp4", "udp6", "tcp", "tcp4", "tcp6"
# "both" 同时监听 UDP 和 TCP；带 4/6 后缀表示仅 IPv4/IPv6
protocol = "both"
# 提供服务的域名（ACME 质询记录均在该域名的子域下）
domain = "auth.example.org"
# 区（zone）的 NS 服务器名，通常与 domain 相同
nsname = "auth.example.org"
# 管理员邮箱，@ 自动替换为 .（SOA 记录中的 RNAME）
nsadmin = "admin.example.org"
# 除 TXT 外额外提供的预定义记录：
#   - A 记录指向 acme-dns 服务器公网 IP
#   - NS 记录使 auth.example.org 解析所有 *.auth.example.org 子域
records = [
    "auth.example.org. A 198.51.100.1",
    "auth.example.org. NS auth.example.org.",
]
# 输出 CORS 等调试信息
debug = false

[database]
# 数据库引擎: "sqlite" 或 "postgres"
engine = "sqlite"
# 连接串：
#   - sqlite 为数据库文件路径（Docker 镜像默认路径为 /var/lib/acme-dns/acme-dns.db）
#   - postgres 为 postgres://user:password@host/db_name
connection = "acme-dns.db"
# connection = "postgres://user:password@localhost/acmedns_db"

[api]
# API 监听 IP，如 127.0.0.1（Nginx 反代时用，直接暴露则用 0.0.0.0）
ip = "0.0.0.0"
# 禁用 /register 注册端点（生产环境固定凭据后可设为 true）
disable_registration = false
# API 监听端口，HTTPS 默认 443
port = "443"
# TLS 方式:
#   "letsencrypt"         自动通过 Let's Encrypt 获取证书
#   "letsencryptstaging"  Let's Encrypt 测试环境（调试用，无速率限制）
#   "cert"                使用自备证书（配合下方 tls_cert_*）
#   "none"                不启用 TLS（配合 Nginx 等反代终结 TLS）
tls = "none"
# 仅 tls = "cert" 时使用：TLS 私钥与证书链路径
tls_cert_privkey = "/etc/tls/example.org/privkey.pem"
tls_cert_fullchain = "/etc/tls/example.org/fullchain.pem"
# 仅 tls = "letsencrypt" 时使用：证书缓存目录
acme_cache_dir = "api-certs"
# 可选邮箱，Let's Encrypt 向其发送 API 证书到期通知
notification_email = ""
# CORS 允许来源，支持通配符
corsorigins = [
    "*"
]
# 是否从 HTTP 请求头获取客户端真实 IP（Nginx 等反代场景设为 true）
use_header = false
# use_header = true 时提取 IP 的请求头名
# 注意：启用后 /update 的 CIDR 限制校验的是请求头中的 IP
header_name = "X-Forwarded-For"
# 启用 HSTS（HTTP 严格传输安全）
hsts_enabled = false
# HSTS 有效期，单位秒（默认 31536000 = 1 年）
hsts_max_age = 31536000
# HSTS includeSubDomains 指令
hsts_include_subdomains = false
# HSTS preload 指令
hsts_preload = false

[logconfig]
# 日志级别: "error", "warning", "info" 或 "debug"
loglevel = "info"
# 日志输出: "stdout" 或 "file"
logtype = "stdout"
# logtype = "file" 时的日志文件路径
logfile = "./acme-dns.log"
# 日志格式: "json" 或 "text"
logformat = "json"
