# Shortener 外层 nginx（HTTPS 终结与域名接入）
# 上游为统一镜像的 shortener-server（单进程：前端页面 + /api/* + /go/ 短码跳转）
# 任意路径原样转发到 8080，无需路径改写；透传头说明见
# https://github.com/jetsung/shortener/blob/main/docs/deployment/DOCKER_AIO.md
upstream shortener {
    server shortener:8080;
    keepalive 32;
}

# WebSocket 升级映射（http{} 层指令，compose 挂载为 conf.d 片段时由 nginx 合并生效）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    # 安全响应头
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传/请求体限制（按需调整）
    client_max_body_size 10m;

    location / {
        proxy_pass http://shortener;
        proxy_http_version 1.1;

        # 必设透传头（后端据此推导 OIDC 回调地址与真实客户端 IP）
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（按需升级）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ============================================================================
