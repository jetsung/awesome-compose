# Shortener Server Configuration
# 完整配置说明: https://github.com/jetsung/shortener/blob/main/docs/general/CONFIGURATION.md
# 环境变量优先于本文件（SERVER__* / DATABASE__URL / CACHE__URL 等，见 compose.yaml）
#
# 注意：镜像 WORKDIR 为 /app，相对路径（./data/...）以 /app 为基准解析。

# ============================================================================
# Server Configuration
# ============================================================================
[server]
# 监听地址（容器内单进程直接对外）
address = "0.0.0.0:8080"

# 可信平台头（可选）：外层反代获取真实客户端 IP 用，如 "X-Real-IP"
trusted-platform = ""

# 短址专用域名（可选）
# 未设置：从监听地址推断并追加 /go 前缀（链接形如 http://host:8080/go/<code>）
# 显式设置：链接直接为 <short_url>/<code>（专用短域名需在外层 nginx 把
# 根路径短码转发到 /go/，参考 nginx.conf 中注释的短域名 server 块）
short_url = ""

# 前端静态资源目录（可选）：统一镜像已内置 /app/static，一般无需修改
static-dir = "/app/static"

# API key（必填，敏感）
# Generate with: openssl rand -base64 32
# IMPORTANT: Change this in production!
api_key = "apikey_for_shortener"

# ============================================================================
# Slug Configuration（短码生成规则）
# ============================================================================
[slug]
# 短码长度（4-16）
length = 6

# 短码字母表
alphabet = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

# ============================================================================
# Admin Account Configuration
# ============================================================================
[admin]
# 管理员用户名（默认 "admin"）
username = "admin"

# 管理员口令哈希（必填）— Argon2id PHC 格式，明文口令不落盘
# Generate with: shortener-server hash-password --password "your-secure-password"
# IMPORTANT: Change this in production!
password_hash = ""

# ============================================================================
# Database Configuration
# ============================================================================
# 连接字符串，引擎由 scheme 推断：sqlite:// / postgres:// / mysql://
# 镜像 WORKDIR 为 /app：相对路径 ./data/... 即 /app/data/...（挂载卷 ./data:/app/data）
[database]
url = "sqlite://./data/shortener.db?mode=rwc"

# 数据库日志级别: 1=Silent, 2=Error, 3=Warn, 4=Info
log_level = 2

# ============================================================================
# Cache Configuration（valkey / redis）
# ============================================================================
[cache]
enabled = true

# 连接字符串，引擎由 scheme 推断："valkey://" 或 "redis://"
# 默认连接 compose 中的 valkey 服务（db 1）
url = "valkey://valkey:6379/1"

# 缓存过期时间（秒，默认 1 小时）
expire = 3600

# 缓存键前缀
prefix = "shorten:"

# ============================================================================
# GeoIP Configuration
# ============================================================================
[geoip]
# 启用 IP 归属地查询（需要 ip2region 数据库文件，见 README）
enabled = true

type = "ip2region"

[geoip.ip2region]
# ip2region.xdb 路径（相对路径以 WORKDIR /app 为基准）
# Download from: https://github.com/lionsoul2014/ip2region/raw/master/data/ip2region_v4.xdb
path = "./data/ip2region.xdb"

# 搜索模式: "vector"(最快) / "btree"(均衡) / "binary"(内存最小)
mode = "vector"

# IP 版本: "4" / "6"
version = "4"

# ============================================================================
# Logging Configuration
# ============================================================================
[logging]
level = "info"
format = "json"
with_timestamp = true
with_target = true
