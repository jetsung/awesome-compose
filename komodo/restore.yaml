services:
  cli:
    image: ghcr.io/moghtech/komodo-cli
    ## （可选）使用 `--restore-folder` 指定特定文件夹，
    ## 否则还原最近的备份。
    command: km database restore -y # --restore-folder 2025-08-14_03-00-01
    volumes:
      # 与上述备份文件相同的挂载
      - /etc/komodo/backups:/backups
    environment:
      ## 数据库端口必须可达。
      ## 请注意与备份相比所需的不同环境变量。
      ## 这是为了防止任何意外还原。
      KOMODO_CLI_DATABASE_TARGET_ADDRESS: ferretdb:27017
      KOMODO_CLI_DATABASE_TARGET_USERNAME: admin
      KOMODO_CLI_DATABASE_TARGET_PASSWORD: admin
      # KOMODO_CLI_DATABASE_TARGET_DB_NAME: komodo-restore
      # KOMODO_CLI_DATABASE_TARGET_DB_NAME: komodo
